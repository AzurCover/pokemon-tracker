name: Test IP datacenter

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Leboncoin depuis un runner GitHub
        run: |
          python3 - <<'PY'
          import http.cookiejar, urllib.error, urllib.request
          import leboncoin

          jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(
              urllib.request.HTTPCookieProcessor(jar))

          def get(url):
              req = urllib.request.Request(url, headers=leboncoin.HEADERS)
              with opener.open(req, timeout=30) as resp:
                  return resp.status

          for step, url in [
              ("accueil", "https://www.leboncoin.fr/"),
              ("recherche", leboncoin.build_url("gros lot cartes pokemon")),
          ]:
              try:
                  code = get(url)
                  print("%-10s HTTP %s (%d cookies)" % (step, code, len(jar)))
              except urllib.error.HTTPError as exc:
                  print("%-10s HTTP %s -- bloque (%d cookies)"
                        % (step, exc.code, len(jar)))
          PY
