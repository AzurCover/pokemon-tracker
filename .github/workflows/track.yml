name: Tracker

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      silencieux:
        description: "Passage muet (amorcer le cache sans notifier)"
        type: boolean
        default: false

# Deux passages simultanes se marcheraient sur l'historique des annonces vues.
concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Leboncoin est injoignable depuis une IP de datacenter (DataDome, HTTP 403),
      # donc le passage cloud ne couvre qu'eBay.
      - name: Historique des annonces deja vues
        uses: actions/cache@v4
        with:
          path: seen.json
          key: seen-${{ github.run_id }}
          restore-keys: seen-

      - name: Scanner eBay
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$EBAY_CLIENT_ID" ]; then
            echo "::error::Secrets EBAY_CLIENT_ID / EBAY_CLIENT_SECRET absents."
            exit 1
          fi
          # Le tout premier passage part d'un cache vide : sans --no-notify il
          # annoncerait comme neuves des annonces vieilles de plusieurs mois.
          python3 tracker.py --source ebay --pages 1 \
            ${{ inputs.silencieux && '--no-notify' || '' }}
